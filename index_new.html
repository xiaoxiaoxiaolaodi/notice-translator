<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>通知视译 · 校园通知视觉转译器</title>
<style>
  :root{
    --bg:#f4f6fb;
    --card:#ffffff;
    --ink:#1f2430;
    --ink-2:#5a6474;
    --ink-3:#98a2b3;
    --line:#e6eaf2;
    --primary:#4f6ef7;
    --primary-soft:#eef1fe;
    --blue:#2f7cf6;
    --blue-soft:#e8f1ff;
    --green:#1fa971;
    --green-soft:#e7f7f0;
    --orange:#e8850c;
    --orange-soft:#fdf3e3;
    --red:#e0483d;
    --red-soft:#fdeceb;
    --radius:16px;
    --shadow:0 4px 20px rgba(31,41,72,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    min-height:100vh;
  }
  .wrap{max-width:980px;margin:0 auto;padding:20px 20px 60px;}

  /* ---------- header ---------- */
  header{display:flex;align-items:center;gap:14px;margin-bottom:6px;}
  .logo{
    width:44px;height:44px;border-radius:12px;flex:none;
    background:linear-gradient(135deg,#4f6ef7,#7a5cf0);
    display:flex;align-items:center;justify-content:center;
    font-size:22px;color:#fff;box-shadow:0 6px 16px rgba(79,110,247,.35);
  }
  h1{font-size:22px;letter-spacing:.5px;}
  h1 small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:2px;margin-top:2px;}
  .tagline{color:var(--ink-2);font-size:14px;margin:6px 0 18px;}
  .tagline b{color:var(--primary);}

  /* ---------- steps ---------- */
  .step-label{
    display:flex;align-items:center;gap:10px;margin:20px 0 10px;
    font-weight:600;font-size:15px;
  }
  .step-num{
    width:24px;height:24px;border-radius:50%;flex:none;
    background:var(--primary);color:#fff;font-size:13px;
    display:flex;align-items:center;justify-content:center;
  }
  .card{
    background:var(--card);border:1px solid var(--line);
    border-radius:var(--radius);box-shadow:var(--shadow);
  }

  /* ---------- input ---------- */
  .input-panel{padding:16px;}
  textarea{
    width:100%;height:200px;resize:vertical;
    border:1px solid var(--line);border-radius:12px;
    padding:14px 16px;font-size:14px;line-height:1.8;
    font-family:inherit;color:var(--ink);background:#fbfcfe;
    outline:none;transition:border .2s;
  }
  textarea:focus{border-color:var(--primary);background:#fff;}
  .input-hint{display:flex;justify-content:space-between;align-items:center;margin-top:10px;flex-wrap:wrap;gap:8px;}
  .char-count{font-size:12px;color:var(--ink-3);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;}
  button{
    border:none;border-radius:10px;cursor:pointer;
    font-family:inherit;font-size:14px;font-weight:600;
    padding:10px 22px;transition:all .15s;
  }
  .btn-primary{
    background:linear-gradient(135deg,#4f6ef7,#6a58f5);color:#fff;
    box-shadow:0 4px 14px rgba(79,110,247,.35);
  }
  .btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(79,110,247,.45);}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed;transform:none;}
  .btn-ghost{background:#fff;color:var(--ink-2);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary);}
  .btn-clear{background:none;color:var(--ink-3);padding:10px 8px;font-weight:400;}

  /* ---------- mode tabs ---------- */
  .mode-tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap;}
  .mode-tab{
    background:#fff;color:var(--ink-2);
    border:1px solid var(--line);
    border-radius:10px;padding:8px 16px;
  }
  .mode-tab.active{
    background:var(--primary-soft);border-color:var(--primary);color:var(--primary);
  }

  /* ---------- link mode ---------- */
  .url-row{display:flex;gap:10px;flex-wrap:wrap;}
  .url-row input{
    flex:1;min-width:240px;border:1px solid var(--line);border-radius:10px;
    padding:11px 14px;font-size:14px;font-family:inherit;outline:none;
    background:#fbfcfe;color:var(--ink);transition:border .2s;
  }
  .url-row input:focus{border-color:var(--primary);background:#fff;}
  .fetch-status{margin-top:12px;font-size:13px;color:var(--ink-2);display:none;min-height:20px;}
  .fetch-status.ok{color:#14805a;}
  .fetch-status.err{color:#c5372d;}
  .fetch-status .spin{
    display:inline-block;width:13px;height:13px;border:2px solid var(--primary);
    border-top-color:transparent;border-radius:50%;vertical-align:-2px;
    margin-right:7px;animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- image mode ---------- */
  .dropzone{
    border:2px dashed #cdd6ea;border-radius:12px;padding:36px 20px;
    text-align:center;color:var(--ink-3);font-size:13.5px;cursor:pointer;
    transition:all .15s;background:#fbfcfe;line-height:2;
  }
  .dropzone b{color:var(--primary);}
  .dropzone:hover,.dropzone.drag{border-color:var(--primary);background:var(--primary-soft);color:var(--primary);}
  .img-list{
    margin-top:14px;display:none;
    grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;
  }
  .thumb{
    position:relative;border:1px solid var(--line);border-radius:10px;
    overflow:hidden;background:#fbfcfe;
  }
  .thumb img{width:100%;height:110px;object-fit:cover;display:block;}
  .thumb .badge{
    position:absolute;left:0;right:0;bottom:0;
    background:rgba(31,36,48,.75);color:#fff;font-size:11px;
    padding:3px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .thumb .badge.done{background:rgba(20,128,90,.88);}
  .thumb .badge.fail{background:rgba(192,55,45,.88);}
  .thumb .badge.running{background:rgba(79,110,247,.88);}
  .thumb-remove{
    position:absolute;top:6px;right:6px;
    background:rgba(31,36,48,.72);color:#fff;border:none;border-radius:8px;
    padding:3px 9px;font-size:11px;font-weight:400;
  }
  .thumb-remove:hover{background:rgba(192,55,45,.9);}
  .thumb-order{
    position:absolute;top:6px;left:6px;
    background:rgba(255,255,255,.92);color:var(--ink-2);
    border-radius:8px;font-size:11px;font-weight:700;padding:2px 8px;
  }
  .ocr-bar{display:none;margin-top:12px;}
  .ocr-bar .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden;}
  .ocr-bar .fill{
    height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#4f6ef7,#7a5cf0);transition:width .3s;
  }
  .ocr-bar .txt{font-size:12px;color:var(--ink-2);margin-top:6px;}
  .ocr-note{font-size:12px;color:var(--ink-3);margin-top:10px;}

  /* ---------- results ---------- */
  #results{display:none;}
  .result-banner{
    display:flex;align-items:center;gap:12px;
    margin:24px 0 14px;
    background:linear-gradient(120deg,#4f6ef7 0%,#7a5cf0 60%,#9a54e8 100%);
    border-radius:var(--radius);padding:13px 20px;
    color:#fff;box-shadow:0 6px 20px rgba(79,110,247,.3);
  }
  .result-banner .rb-icon{
    width:42px;height:42px;border-radius:12px;flex:none;
    background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);
    display:flex;align-items:center;justify-content:center;font-size:21px;
  }
  .result-banner h2{font-size:19px;letter-spacing:1px;}
  .result-banner h2 small{font-weight:400;opacity:.8;font-size:12px;letter-spacing:2px;display:block;margin-top:1px;}
  .result-banner .sub{font-size:12.5px;opacity:.9;font-weight:400;margin-left:auto;text-align:right;}

  .board{display:flex;flex-direction:column;gap:16px;}
  .pane{
    padding:24px 26px;position:relative;overflow:hidden;
    border-top:4px solid var(--primary);
    animation:fadeUp .45s ease both;
  }
  .p1{border-top-color:#2f7cf6;}
  .p2{border-top-color:#6a58f5;animation-delay:.08s;}
  .p3{border-top-color:#1fa971;animation-delay:.16s;}
  @keyframes fadeUp{
    from{opacity:0;transform:translateY(16px);}
    to{opacity:1;transform:none;}
  }
  .pane-head{display:flex;align-items:center;gap:13px;margin-bottom:18px;}
  .pane-icon{
    width:46px;height:46px;border-radius:13px;flex:none;
    display:flex;align-items:center;justify-content:center;font-size:23px;
    box-shadow:0 4px 12px rgba(31,41,72,.14);
  }
  .pane-title{font-size:18px;font-weight:800;letter-spacing:.5px;}
  .pane-title small{display:block;font-size:12px;font-weight:400;color:var(--ink-3);letter-spacing:0;margin-top:2px;}
  .copy-btn{
    margin-left:auto;background:#fff;border:1px solid var(--line);
    border-radius:8px;color:var(--ink-3);font-size:12px;font-weight:600;
    padding:6px 14px;
  }
  .copy-btn:hover{color:#fff;background:var(--primary);border-color:var(--primary);}

  /* pane colors */
  .p1 .pane-icon{background:linear-gradient(135deg,#2f7cf6,#5aa2ff);}
  .p2 .pane-icon{background:linear-gradient(135deg,#4f6ef7,#7a5cf0);}
  .p3 .pane-icon{background:linear-gradient(135deg,#1fa971,#37c98f);}
  .gist{
    font-size:17px;font-weight:700;line-height:1.95;
    background:linear-gradient(120deg,#e8f1ff,#f0edff);
    border-left:6px solid #2f7cf6;
    border-radius:0 12px 12px 0;padding:16px 20px;margin-bottom:18px;
    color:#1c2d55;
  }
  .facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;}
  .fact{
    background:#fbfcfe;border:1px solid var(--line);border-left:4px solid #2f7cf6;
    border-radius:10px;padding:11px 14px;font-size:13px;
  }
  .fact:nth-child(4n+1){border-left-color:#2f7cf6;}
  .fact:nth-child(4n+2){border-left-color:#6a58f5;}
  .fact:nth-child(4n+3){border-left-color:#e8850c;}
  .fact:nth-child(4n+4){border-left-color:#1fa971;}
  .fact .k{color:var(--ink-3);font-size:11px;margin-bottom:3px;font-weight:600;letter-spacing:1px;}
  .fact .v{font-weight:700;color:var(--ink);font-size:14px;}

  /* timeline */
  .timeline{margin-top:18px;border-top:1px dashed var(--line);padding-top:15px;}
  .timeline .tl-title{font-size:12px;color:var(--ink-3);margin-bottom:11px;letter-spacing:1px;font-weight:700;}
  .tl-items{display:flex;flex-wrap:wrap;gap:10px;}
  .tl-item{
    display:flex;align-items:center;gap:8px;
    background:var(--orange-soft);border-radius:999px;
    padding:7px 16px 7px 9px;font-size:13.5px;font-weight:700;color:#8a5a10;
    border:1px solid #f3d9b0;
  }
  .tl-dot{width:9px;height:9px;border-radius:50%;background:var(--orange);flex:none;}
  .tl-item.urgent{
    background:var(--red-soft);color:#a33229;border-color:#f2c4c0;
    box-shadow:0 2px 10px rgba(224,72,61,.25);
  }
  .tl-item.urgent .tl-dot{background:var(--red);}

  /* pane 2 : actions */
  .todo-list{display:flex;flex-direction:column;gap:10px;}
  .todo{
    display:flex;align-items:flex-start;gap:12px;
    background:#fbfcfe;border:1px solid var(--line);border-left:4px solid #cdd6ea;
    border-radius:12px;padding:13px 16px;transition:all .15s;
  }
  .todo:hover{
    border-color:var(--primary);border-left-color:var(--primary);
    background:var(--primary-soft);
    box-shadow:0 4px 14px rgba(79,110,247,.16);
  }
  .todo:has(input:checked){border-left-color:#1fa971;background:#f2fbf7;opacity:.75;}
  .todo input[type=checkbox]{
    width:19px;height:19px;margin-top:3px;flex:none;
    accent-color:var(--primary);cursor:pointer;
  }
  .todo .txt{font-size:14.5px;font-weight:500;}
  .todo .txt.done{color:var(--ink-3);text-decoration:line-through;font-weight:400;}
  .todo .chip{
    display:inline-block;font-size:11px;font-weight:700;border-radius:6px;
    padding:2px 9px;margin-left:8px;vertical-align:1px;
  }
  .chip.deadline{background:var(--red-soft);color:#c5372d;border:1px solid #f2c4c0;}
  .chip.date{background:var(--orange-soft);color:#a8690f;border:1px solid #f3d9b0;}

  /* pane 3 : pros & cons */
  .gd-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media(max-width:720px){.gd-grid{grid-template-columns:1fr;}}
  .gd-col{border-radius:12px;padding:15px 17px;border:1px solid transparent;}
  .gd-col h4{
    font-size:14px;margin-bottom:11px;display:flex;align-items:center;gap:6px;
    font-weight:800;letter-spacing:.5px;
    padding-bottom:8px;border-bottom:1px dashed rgba(0,0,0,.1);
  }
  .gd-col ul{list-style:none;}
  .gd-col li{
    font-size:13.5px;padding:8px 10px 8px 27px;border-radius:8px;
    position:relative;margin-bottom:5px;line-height:1.65;font-weight:500;
  }
  .gd-col li::before{position:absolute;left:8px;top:9px;font-weight:800;}
  .gd-good{background:linear-gradient(160deg,#e2f6ec,#f3fcf8);border-color:#c8ecdb;}
  .gd-good h4{color:#14805a;}
  .gd-good li::before{content:"✓";color:var(--green);}
  .gd-good li{background:rgba(255,255,255,.8);}
  .gd-warn{background:linear-gradient(160deg,#fdefd9,#fef9ee);border-color:#f5e2bd;}
  .gd-warn h4{color:#b06a05;}
  .gd-warn li::before{content:"!";color:var(--orange);}
  .gd-warn li{background:rgba(255,255,255,.8);}
  .gd-risk{
    background:linear-gradient(160deg,#fde7e5,#fef6f5);grid-column:1 / -1;
    border-color:#f5cbc8;
  }
  .gd-risk h4{color:#bb3a30;}
  .gd-risk li::before{content:"✕";color:var(--red);}
  .gd-risk li{background:rgba(255,255,255,.8);}

  /* ---------- original text annotation ---------- */
  .anno-toggle{
    display:flex;align-items:center;gap:10px;margin:24px 0 10px;
    font-size:14px;color:var(--ink-2);cursor:pointer;user-select:none;
  }
  .anno-toggle input{accent-color:var(--primary);width:16px;height:16px;cursor:pointer;}
  .legend{display:flex;gap:14px;flex-wrap:wrap;margin-left:auto;font-size:12px;color:var(--ink-3);}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px;}
  .anno-panel{padding:22px 26px;font-size:14px;line-height:2.1;white-space:pre-wrap;word-break:break-all;display:none;}
  .anno-panel.show{display:block;}
  mark{border-radius:5px;padding:1px 3px;color:inherit;}
  mark.m-act{background:#fff1c2;box-shadow:inset 0 -2px 0 #e8b93c;}
  mark.m-good{background:#d9f3e7;box-shadow:inset 0 -2px 0 #4cc590;}
  mark.m-risk{background:#fbdedb;box-shadow:inset 0 -2px 0 #ef9089;}
  mark.m-date{background:#fde3c8;box-shadow:inset 0 -2px 0 #f0a05a;font-weight:700;}

  footer{
    margin-top:44px;text-align:center;font-size:12px;color:var(--ink-3);
    border-top:1px solid var(--line);padding-top:20px;
  }
  .empty-tip{
    text-align:center;color:var(--ink-3);font-size:13.5px;
    padding:40px 20px;
  }

  /* ================================================================
     移动端适配（≤640px）
     ================================================================ */
  @media(max-width:640px){
    .wrap{padding:16px 12px 60px;}
    header{gap:10px;}
    .logo{width:40px;height:40px;font-size:20px;border-radius:12px;}
    h1{font-size:19px;}
    h1 small{font-size:10px;letter-spacing:1.5px;}
    .tagline{font-size:12.5px;margin:8px 0 16px;line-height:1.65;}

    /* 输入区 */
    .step-label{font-size:13.5px;margin:20px 0 10px;}
    .input-panel{padding:12px;}
    textarea{height:180px;font-size:16px;padding:12px 13px;}   /* ≥16px 防iOS聚焦自动放大 */
    .mode-tabs{gap:6px;}
    .mode-tab{flex:1;padding:9px 6px;font-size:13px;text-align:center;}
    .url-row{flex-direction:column;gap:8px;}
    .url-row input{min-width:0;width:100%;font-size:16px;}      /* 同上防缩放 */
    .url-row .btn-primary{width:100%;}
    .input-hint{flex-direction:column;align-items:stretch;gap:10px;}
    .char-count{text-align:right;}
    .btn-row{width:100%;}
    .btn-row .btn-primary{flex:1;}
    .btn-row .btn-ghost{flex:1;}
    .fetch-status,.ocr-note{font-size:12px;}

    /* 图片区 */
    .dropzone{padding:26px 14px;font-size:12.5px;}
    .thumb img{height:84px;}
    .thumb-remove,.thumb-order{padding:3px 8px;}

    /* 结果横幅 */
    .result-banner{flex-wrap:wrap;padding:14px 16px;gap:12px;border-radius:14px;}
    .result-banner .rb-icon{width:42px;height:42px;font-size:21px;}
    .result-banner h2{font-size:17px;letter-spacing:1px;}
    .result-banner h2 small{font-size:10px;letter-spacing:1.5px;}
    .result-banner .sub{margin-left:0;width:100%;text-align:left;font-size:11px;}

    /* 三张卡片 */
    .pane{padding:18px 14px;}
    .pane-head{gap:10px;margin-bottom:14px;}
    .pane-icon{width:40px;height:40px;font-size:20px;}
    .pane-title{font-size:15.5px;}
    .copy-btn{padding:6px 10px;font-size:11px;}
    .gist{font-size:15px;padding:13px 14px;line-height:1.85;}
    .facts{grid-template-columns:repeat(auto-fill,minmax(135px,1fr));gap:8px;}
    .fact .v{font-size:13px;}
    .tl-item{font-size:12.5px;padding:6px 12px 6px 8px;}
    .todo{padding:11px 12px;}
    .todo input[type=checkbox]{width:22px;height:22px;}        /* 触屏点按更大 */
    .todo .txt{font-size:14px;}
    .gd-grid{grid-template-columns:1fr;gap:10px;}
    .gd-col{padding:12px 13px;}
    .gd-col li{font-size:13px;}

    /* 原文标注 */
    .anno-toggle{flex-wrap:wrap;font-size:12.5px;gap:8px;}
    .anno-toggle .legend{margin-left:0;width:100%;}
    .anno-panel{padding:16px 14px;font-size:13px;line-height:1.95;}

    footer{font-size:11px;margin-top:32px;padding-top:16px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">🎯</div>
    <h1>通知视译<small>CAMPUS&nbsp;NOTICE&nbsp;DECODER</small></h1>
  </header>
  <p class="tagline">粘贴 · 链接 · 截图 → 一键提炼「<b>什么事 · 做什么 · 得失注意</b>」</p>

  <!-- step 1 : input -->
  <div class="step-label"><span class="step-num">1</span>输入通知</div>
  <div class="card input-panel">
    <div class="mode-tabs">
      <button class="mode-tab active" data-mode="text">📝 文本粘贴</button>
      <button class="mode-tab" data-mode="link">🔗 链接导入</button>
      <button class="mode-tab" data-mode="image">🖼️ 图片识别</button>
    </div>

    <!-- 文本模式 -->
    <div id="panel-text">
      <textarea id="src" placeholder="把通知原文粘贴到这里…（本地分析，不上传）"></textarea>
    </div>

    <!-- 链接模式 -->
    <div id="panel-link" style="display:none">
      <div class="url-row">
        <input id="urlInput" type="url" placeholder="粘贴通知链接，如微信公众号文章、学校官网通知页…">
        <button class="btn-primary" id="btnFetch">🌐 抓取内容</button>
      </div>
      <div class="fetch-status" id="fetchStatus"></div>
      <div class="ocr-note">普通网页可直接抓取；微信文章需截图识别</div>
    </div>

    <!-- 图片模式 -->
    <div id="panel-image" style="display:none">
      <div class="dropzone" id="dropzone">
        <b>点击 / 拖入 / Ctrl+V 粘贴</b>截图，可多张，按顺序合并识别
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple style="display:none">
      <div class="img-list" id="imgList"></div>
      <div class="ocr-bar" id="ocrBar">
        <div class="track"><div class="fill" id="ocrFill"></div></div>
        <div class="txt" id="ocrTxt">准备中…</div>
      </div>
      <div class="ocr-note">本地识别不上传；首次需下载约 15MB 中文模型</div>
    </div>

    <div class="input-hint">
      <span class="char-count" id="charCount">0 字</span>
      <div class="btn-row">
        <button class="btn-ghost" id="btnDemo">📋 载入示例</button>
        <button class="btn-clear" id="btnClear">清空</button>
        <button class="btn-primary" id="btnGo">⚡ 开始转译</button>
      </div>
    </div>
  </div>

<script>
/* ================================================================
   语义提取引擎（本地规则式，无需联网）
   ================================================================ */
const RX = {
  eventName : /[《"“]([^》"”]{2,26})[》"”]|[（(]([^（）)]{2,20})[）)]?[^，。\n]{0,4}(杯|大赛|比赛|竞赛|演讲赛|辩论赛|活动|讲座|论坛|晚会|招募|训练营|计划|工程)/,
  bareEvent : /([\u4e00-\u9fa5A-Za-z0-9]{1,12}(?:杯|大赛|比赛|竞赛|演讲赛|辩论赛|讲座|论坛|招募|训练营))/,
  organizer : /([\u4e00-\u9fa5]{2,14}(?:书院|学院|大学|学校|学生会|团委|研究生会|社团|中心|委员会|自管会))/,
  audience  : /(?:面向|针对|适用[于]?|参赛对象|活动对象|报名对象|招募对象)[：:\s]*\n?([^\n，。；,\s]{2,20})/,
  audience2 : /(全体[\u4e00-\u9fa5]{1,10}(?:同学|学生|新生|本科生|研究生))/,
  theme     : /主题[“"：:\s]*([^”"\n。；]{3,40})/,
  date      : /(\d{1,2})\s*月\s*(\d{1,2})\s*日(?:\s*[/·]?\s*(\d{1,2})[：:](\d{2}))?|(\d{1,2})\s*月\s*(\d{1,2})\s*日/,
  time      : /(\d{1,2})[：:](\d{2})/,
  place     : /(?:地点|教室|会场|位置)[：:\s]*([^\n，。,；]{2,30})/,
  quota     : /推选\s*(\d+)\s*名|选出?\s*(\d+)\s*名|名额\s*(\d+)\s*人|限\s*(\d+)\s*人/,
  actSent   : /报名|截止|提交|上传|填写|扫码|扫描|二维码|加入|进群|加群|准备|制作|携带|自带|到场|参加|关注|转发|注册|登记|签到|缴纳|缴费|报名费|押金|面试|笔试|初赛|决赛|选拔|紧扣/,
  goodSent  : /奖励|奖金|奖品|证书|荣誉|综测|综合测评|加分|学分|绩点|保研|推免|推选|晋级|代表|锻炼|提升|机会|履历|简历|风采|舞台|展示|志愿时长|工时|补助|补贴|礼品|周边/,
  riskSent  : /扣分|取消(?:资格|成绩)|严禁|禁止|不得|超时|迟到|后果自负|一经查实|抄袭|套作|代写|违约|保证金|逾期|视为(?:放弃|无效)|自动放弃|名额有限|先到先得|风险/,
  warnSent  : /注意|请勿|务必|请(?:提前|按时|及时)|持续关注|以(?:官方|最新)|为准|或有|暂定|待定|另行通知|变动|调整|延期|取消举办|咨询|联系|答疑/,
  /* 待办句必须有"指令性"词，避免标题/小节名混入（须知≠须） */
  todoModal : /请|需|须(?!知)|应|务必|要求|截止|之前|紧扣|扫码|扫描|填写|提交|上传|制作|准备|携带|自带|到场|加入|关注|缴纳|缴费|签到|登记|注册|[：:]\d{2}\s*前$/,
};

const SENT_SPLIT = /(?<=[。！？!?；;\n])|\n+/;

function splitSentences(text){
  return text.split(SENT_SPLIT)
    .map(s => s.replace(/\s+/g,' ').trim())
    .filter(s => s.length > 3 && !/^\|?\s*[-—]*\s*$/.test(s) && !/^(内容来源|排版编辑|审核校对|图文来源)/.test(s));
}

function cleanLine(s){
  return s.replace(/[|｜]/g,' ').replace(/\s{2,}/g,' ').replace(/^[-–—•·]+\s*/,'').trim();
}

/* 提取时间线：句子含日期 → 找该句中的事件词 */
function extractTimeline(sents){
  const items = [];
  const now = new Date();
  const nowMd = (now.getMonth()+1)*100 + now.getDate();
  sents.forEach(s => {
    const dm = s.match(RX.date);
    if(!dm) return;
    let label = null;
    if(/报名|截止/.test(s)) label = '报名截止';
    else if(/初赛|比赛时间|举行|开展|举办/.test(s)) label = '比赛/活动举行';
    else if(/决赛/.test(s)) label = '决赛';
    else if(/提交|上传/.test(s)) label = '材料提交';
    else if(/讲座|宣讲/.test(s)) label = '讲座/宣讲';
    else if(/公布|公示|出结果/.test(s)) label = '结果公布';
    else label = '关键节点';
    const m = +dm[1] || +dm[5], d = +dm[2] || +dm[6];
    const tm = s.match(RX.time);
    const dateStr = `${m}月${d}日` + (tm ? ` ${tm[1]}:${tm[2]}` : '');
    // 今年还是明年？
    const v = m*100+d;
    const year = v < nowMd - 200 ? now.getFullYear()+1 : now.getFullYear();
    // 去重
    if(!items.some(it => it.dateStr === dateStr && it.label === label)){
      items.push({label, dateStr, sortKey: year*10000 + m*100 + d});
    }
  });
  items.sort((a,b)=>a.sortKey-b.sortKey);
  return items;
}

function analyze(text){
  const raw = text.replace(/\r/g,'');
  const sents = splitSentences(raw);
  const joined = sents.map(cleanLine).join(' ');

  /* ---- 事件名 ---- */
  let eventName = null;
  const qm = raw.match(/[《"“]([^》"”]{2,26})[》"”]/);
  if(qm && /(杯|赛|比赛|活动|讲座|论坛|计划|营|工程|大赛)/.test(qm[1])) eventName = qm[1];
  if(!eventName){ const b = joined.match(RX.bareEvent); if(b) eventName = b[1]; }
  if(!eventName){ const b = raw.match(RX.bareEvent); if(b) eventName = b[1]; }
  if(eventName) eventName = eventName.replace(/^(本届|此次|这个)+/,'');

  /* ---- 主办方 ---- */
  let organizer = null;
  const om = joined.match(/([\u4e00-\u9fa5]{2,14}(?:书院|学院|学生会|团委|社团|中心|委员会|自管会))[^，。\n]{0,10}(?:主办|承办|举办|开展|组织|发布|发起)/);
  if(om) organizer = om[1];
  if(!organizer){ const o2 = joined.match(RX.organizer); if(o2) organizer = o2[1]; }

  /* ---- 对象（在原始文本上匹配，避免跨行误捕） ---- */
  let audience = null;
  const am = raw.match(RX.audience) || raw.match(RX.audience2);
  if(am) audience = (am[1]||am[0]).replace(/（[^）]*）/g,'').trim();

  /* ---- 主题 ---- */
  let theme = null;
  const tm = joined.match(RX.theme);
  if(tm) theme = tm[1].replace(/["”']/g,'').trim();

  /* ---- 名额 ---- */
  let quota = null;
  const qm2 = joined.match(RX.quota);
  if(qm2) quota = (qm2[1]||qm2[2]||qm2[3]||qm2[4]) + ' 名';

  /* ---- 地点 ---- */
  let place = null;
  const pm = joined.match(RX.place);
  if(pm) place = pm[1];

  /* ---- 亮点句（用于一句话概括） ---- */
  const trackMatch = joined.match(/(仅设|设有?)([\u4e00-\u9fa5A-Za-z0-9]{1,12}赛道)/);
  const track = trackMatch ? trackMatch[2] : null;

  /* ---- 一句话概括 ---- */
  const parts = [];
  if(organizer && eventName && !eventName.includes(organizer)) parts.push(`${organizer}组织的`);
  else if(organizer) parts.push(`${organizer}发布的`);
  parts.push(eventName ? `「${eventName}」` : '一项校园活动');
  if(audience) parts.push(`，面向${audience}`);
  if(theme) parts.push(`，主题围绕“${theme}”`);
  if(track) parts.push(`，${track}`);
  let gist = parts.join('') + '。';
  if(quota) gist += ` 优秀者将获得推选机会（约 ${quota}）。`;

  /* ---- 行动清单 ---- */
  const stripNum = s => s.replace(/^\s*\d+\s*[.、．]\s*/,'');
  const actSentences = sents.filter(s =>
    RX.actSent.test(s) && RX.todoModal.test(s) &&
    !/或有变动|以.{0,4}为准|另行通知/.test(s)      // 软性提示归入"注意事项"
  );
  const todos = [];
  const seen = new Set();
  actSentences.forEach(s => {
    let t = stripNum(cleanLine(s));
    if(t.length > 70) t = t.slice(0, 70) + '…';
    t = t.replace(/^[，、。；\s]+/,'');
    const key = t.slice(0, 30);
    if(seen.has(key)) return;
    // 判断是否含截止时间
    const hasDeadline = /截止|之前|前$|报名.*时间/.test(t) && RX.date.test(t);
    const hasDate = RX.date.test(t);
    seen.add(key);
    todos.push({text: t, deadline: hasDeadline, dated: hasDate});
  });
  // 报名截止放最前
  todos.sort((a,b) => (b.deadline?1:0)-(a.deadline?1:0));

  /* ---- 好处 / 注意 / 风险 ---- */
  const goods = [], warns = [], risks = [];
  const seenG = new Set(), seenW = new Set(), seenR = new Set();
  sents.forEach(s => {
    let t = stripNum(cleanLine(s));
    if(t.length > 80) return;
    const key = t.slice(0,25);
    if(RX.riskSent.test(t)){
      if(!seenR.has(key)){ risks.push(t); seenR.add(key); }
    } else if(RX.goodSent.test(t)){
      if(!seenG.has(key)){ goods.push(t); seenG.add(key); }
    } else if(RX.warnSent.test(t)){
      if(!seenW.has(key)){ warns.push(t); seenW.add(key); }
    }
  });

  /* ---- 时间线 ---- */
  const timeline = extractTimeline(sents);

  return {eventName, organizer, audience, theme, quota, place, track, gist,
          todos, goods, warns, risks, timeline, sents, raw};
}

/* ================================================================
   渲染
   ================================================================ */
const $ = id => document.getElementById(id);
let lastAnalysis = null;

function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function render(A){
  lastAnalysis = A;

  /* meta */
  const metaBits = [];
  if(A.organizer) metaBits.push(A.organizer);
  metaBits.push(`共分析 ${A.sents.length} 个句子`);
  $('metaInfo').textContent = metaBits.join(' · ');

  /* pane 1 */
  $('gist').textContent = A.gist;
  const facts = [];
  if(A.eventName) facts.push(['活动名称', A.eventName]);
  if(A.organizer) facts.push(['主办方', A.organizer]);
  if(A.audience) facts.push(['参与对象', A.audience]);
  if(A.theme) facts.push(['主题', A.theme]);
  if(A.track) facts.push(['赛道', A.track]);
  if(A.quota) facts.push(['推选名额', A.quota + '（以通知为准）']);
  if(A.place) facts.push(['地点', A.place]);
  facts.push(['形式', /线下/.test(A.raw) ? '线下举行' : (/线上|腾讯会议|直播/.test(A.raw) ? '线上/含线上' : '见通知')]);
  $('facts').innerHTML = facts.map(([k,v]) =>
    `<div class="fact"><div class="k">${esc(k)}</div><div class="v">${esc(v.length>30? v.slice(0,30)+'…':v)}</div></div>`).join('');

  /* timeline */
  if(A.timeline.length){
    $('timelineBox').style.display = '';
    const now = new Date(), nowKey = (now.getMonth()+1)*100+now.getDate();
    $('tlItems').innerHTML = A.timeline.slice(0,8).map(it => {
      const md = it.dateStr.match(/(\d+)月(\d+)日/);
      const isPast = md && (+md[1]*100 + +md[2]) < nowKey;
      const urgent = !isPast && /截止|提交/.test(it.label);
      return `<div class="tl-item ${urgent?'urgent':''}"><span class="tl-dot"></span>${esc(it.label)} · ${esc(it.dateStr)}${isPast?' <span style="font-weight:400;opacity:.6">(已过)</span>':''}</div>`;
    }).join('');
  } else {
    $('timelineBox').style.display = 'none';
  }

  /* pane 2 */
  if(A.todos.length){
    $('todos').innerHTML = A.todos.slice(0,12).map((t,i) => `
      <label class="todo">
        <input type="checkbox" data-i="${i}">
        <span class="txt" id="td${i}">${esc(t.text)}
          ${t.deadline ? '<span class="chip deadline">⏰ 含截止时间</span>' : (t.dated ? '<span class="chip date">📅 有时间节点</span>' : '')}
        </span>
      </label>`).join('');
    $('todos').querySelectorAll('input[type=checkbox]').forEach(cb => {
      cb.addEventListener('change', () => {
        $('td'+cb.dataset.i).classList.toggle('done', cb.checked);
      });
    });
  } else {
    $('todos').innerHTML = '<div class="empty-tip">这篇通知里没有明确要求同学执行的动作，可能只是一篇纯宣传/告知类消息。</div>';
  }

  /* pane 3 */
  $('goodList').innerHTML = A.goods.length
    ? A.goods.slice(0,8).map(t => `<li>${esc(t)}</li>`).join('')
    : '<li style="color:var(--ink-3)">未在通知中找到明确的奖励/好处描述</li>';
  $('warnList').innerHTML = A.warns.length
    ? A.warns.slice(0,8).map(t => `<li>${esc(t)}</li>`).join('')
    : '<li style="color:var(--ink-3)">未发现特别标注的注意事项</li>';
  if(A.risks.length){
    $('riskBox').style.display = '';
    $('riskList').innerHTML = A.risks.slice(0,8).map(t => `<li>${esc(t)}</li>`).join('');
  } else {
    $('riskBox').style.display = 'none';
  }

  buildAnnotation(A);
  $('results').style.display = 'block';
  if($('results').scrollIntoView){
    $('results').scrollIntoView({behavior:'smooth', block:'start'});
  }
}

/* ---------- 原文标注 ---------- */
function buildAnnotation(A){
  let html = esc(A.raw);
  // 顺序很重要：先小粒度后大粒度会互相覆盖，这里按句子级别标注
  // 简化策略：直接对整段 esc 后的文本做句子替换
  const sentSet = new Set();
  A.sents.forEach(s => sentSet.add(cleanLine(s)));

  html = html.replace(/([^。\n！？!?；;]{4,})/g, (m) => {
    const t = m.replace(/\s+/g,' ').trim();
    if(t.length < 4) return m;
    if(RX.riskSent.test(t)) return `<mark class="m-risk">${m}</mark>`;
    if(RX.actSent.test(t) && RX.date.test(t)) return `<mark class="m-date">${m}</mark>`;
    if(RX.actSent.test(t)) return `<mark class="m-act">${m}</mark>`;
    if(RX.goodSent.test(t)) return `<mark class="m-good">${m}</mark>`;
    return m;
  });
  $('annoPanel').innerHTML = html;
}

const PROXIES = [
  { name:'Jina Reader', build:u => 'https://r.jina.ai/' + u,                                    type:'md'   },
  { name:'AllOrigins',  build:u => 'https://api.allorigins.win/raw?url=' + encodeURIComponent(u), type:'html' },
  { name:'CodeTabs',    build:u => 'https://api.codetabs.com/v1/proxy?quest=' + encodeURIComponent(u), type:'html' },

function htmlToText(html){
  const doc = new DOMParser().parseFromString(html, 'text/html');
  doc.querySelectorAll('script,style,noscript,iframe').forEach(n => n.remove());
  // 微信公众号文章正文优先
  const el = doc.querySelector('#js_content')
          || doc.querySelector('.rich_media_content')
          || doc.querySelector('article')
          || doc.body
          || doc.documentElement;
  if(!el) return '';
  const clone = el.cloneNode(true);
  clone.querySelectorAll('br').forEach(b => b.replaceWith('\n'));
  clone.querySelectorAll('p,div,li,h1,h2,h3,h4,h5,section,tr,blockquote').forEach(b => b.append('\n'));
  let t = clone.textContent || '';
  // 标题补充（微信文章标题不在正文容器内）
  const h = doc.querySelector('#activity-name') || doc.querySelector('h1');
  if(h && h.textContent.trim() && !t.includes(h.textContent.trim().slice(0, 10))){
    t = h.textContent.trim() + '\n\n' + t;
  }
  return t.replace(/\u00a0/g,' ').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
}

function cleanMarkdown(t){
  return t.replace(/!\[[^\]]*\]\([^)]*\)/g,'')          // 图片
          .replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')       // 链接保留文字
          .replace(/^\s*[-=]{3,}\s*$/gm,'')             // 分隔线
          .replace(/[ \t]{2,}/g,' ')
          .trim();
}

async function fetchWithTimeout(url, ms){
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), ms);
  try{
    const resp = await fetch(url, { signal: ctrl.signal });
    if(!resp.ok) throw new Error('HTTP ' + resp.status);
    return await resp.text();
  } finally { clearTimeout(timer); }
}

$('btnFetch').addEventListener('click', async () => {
  let url = $('urlInput').value.trim();
  if(!url){ alert('请先粘贴通知链接'); return; }
  if(!/^https?:\/\//i.test(url)) url = 'https://' + url;

  const st = $('fetchStatus');
  $('btnFetch').disabled = true;
  st.style.display = 'block';
  st.className = 'fetch-status';
  st.innerHTML = '<span class="spin"></span>正在通过代理抓取链接内容…';

  let finalText = null, errors = [];
  for(const p of PROXIES){
    try{
      st.innerHTML = '<span class="spin"></span>正在尝试 ' + p.name + ' 通道…';
      const raw = await fetchWithTimeout(p.build(url), 20000);
      let text;
      if(/<html|<!doctype/i.test(raw) || (p.type === 'html' && raw.trimStart().startsWith('<'))){
        text = htmlToText(raw);
      } else {
        text = cleanMarkdown(raw);
      }
      text = text.trim();
      if(text.length >= 100 && !/环境异常|完成验证后即可/.test(text)){
        finalText = text;
        break;
      }
      if(/环境异常|完成验证后即可/.test(text)){
        errors.push(p.name + '：微信要求人机验证');
      }else{
        errors.push(p.name + ' 返回内容过短');
      }
    }catch(e){
      errors.push(p.name + ': ' + (e.name === 'AbortError' ? '超时' : e.message));
    }
  }

  $('btnFetch').disabled = false;
  if(finalText){
    st.className = 'fetch-status ok';
    st.textContent = '✓ 抓取成功（' + finalText.length + ' 字），已载入并完成转译';
    fillText(finalText, true);
    setMode('text');
  }else{
    st.className = 'fetch-status err';
    const wxBlocked = /mp\.weixin\.qq\.com/i.test(url) || errors.some(e => e.includes('人机验证'));
    st.textContent = wxBlocked
      ? '✕ 微信文章有防盗验证，代理通道无法读取。推荐做法：微信里截图这篇文章 → 回到「图片识别」粘贴截图，秒级完成转译～'
      : '✕ 抓取失败：' + errors.join('；') + '。建议改用文本粘贴或图片识别。';
  }
});

/* ================================================================
   图片识别：Tesseract.js 本地 OCR（按需加载）
   ================================================================ */
let tesseractLoading = null;
function loadTesseract(){
  if(window.Tesseract) return Promise.resolve();
  if(tesseractLoading) return tesseractLoading;
  tesseractLoading = new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('OCR 组件加载失败，请检查网络后重试'));
    document.head.appendChild(s);
  });
  return tesseractLoading;
}

/* ---------- 多张图片队列 ---------- */
let imageItems = [];      // {file, url, status: pending|running|done|fail, pct, text, removed}
let ocrRunning = false;

function setOcrBar(show, pct, txt){
  $('ocrBar').style.display = show ? 'block' : 'none';
  if(pct != null) $('ocrFill').style.width = Math.round(pct * 100) + '%';
  if(txt != null) $('ocrTxt').textContent = txt;
}

function badgeText(it){
  if(it.status === 'pending') return '等待识别';
  if(it.status === 'running') return '识别中 ' + Math.round((it.pct||0) * 100) + '%';
  if(it.status === 'done')    return '✓ ' + it.text.length + ' 字';
  return '✕ 识别失败';
}

function renderImgList(){
  const box = $('imgList');
  box.innerHTML = imageItems.map((it, i) => `
    <div class="thumb">
      <img src="${it.url}" alt="第${i+1}张">
      <span class="thumb-order">${i+1}</span>
      <button class="thumb-remove" data-i="${i}" title="移除这张">✕</button>
      <span class="badge ${it.status}">${badgeText(it)}</span>
    </div>`).join('');
  box.style.display = imageItems.length ? 'grid' : 'none';
}

function updateBadges(){
  // 只更新角标文本，避免整列表重绘打断图片加载
  imageItems.forEach((it, i) => {
    const b = $('imgList').querySelector(`.thumb:nth-child(${i+1}) .badge`);
    if(b){ b.textContent = badgeText(it); b.className = 'badge ' + it.status; }
  });
}

function updateOverallBar(){
  const total = imageItems.length || 1;
  const doneCount = imageItems.filter(it => it.status === 'done' || it.status === 'fail').length;
  const cur = imageItems.find(it => it.status === 'running');
  const frac = (doneCount + (cur ? cur.pct || 0 : 0)) / total;
  setOcrBar(true, Math.min(frac, 1),
    `正在识别第 ${Math.min(doneCount + 1, total)} / ${total} 张…（已识别 ${imageItems.filter(it=>it.status==='done').length} 张）`);
}

function addImages(files){
  let added = 0;
  [...files].forEach(f => {
    if(!f || !/^image\//.test(f.type)) return;
    imageItems.push({
      file: f, url: URL.createObjectURL(f),
      status: 'pending', pct: 0, text: '', removed: false
    });
    added++;
  });
  if(!added){
    alert('没有检测到图片文件（支持 JPG / PNG / WEBP）');
    return;
  }
  renderImgList();
  runOcrQueue();
}

async function runOcrQueue(){
  if(ocrRunning) return;                     // 已在跑，新图会自动排进队列
  if(!imageItems.some(it => it.status === 'pending')) return;
  ocrRunning = true;
  let worker = null;
  try{
    setOcrBar(true, 0, '正在加载中文识别模型（首次约 15MB，请稍候）…');
    await loadTesseract();
    // 整个队列共用一个 worker，避免反复加载模型
    worker = await Tesseract.createWorker(['chi_sim','eng'], 1, {
      logger: m => {
        if(m.status === 'recognizing text'){
          const cur = imageItems.find(it => it.status === 'running');
          if(cur){ cur.pct = m.progress; updateBadges(); updateOverallBar(); }
        }
      }
    });
    while(true){
      const idx = imageItems.findIndex(it => it.status === 'pending');
      if(idx === -1) break;
      const it = imageItems[idx];
      it.status = 'running'; it.pct = 0;
      renderImgList();
      updateOverallBar();
      try{
        const { data } = await worker.recognize(it.file);
        it.text = (data.text || '').replace(/[ \t]+/g,' ').replace(/\n{3,}/g,'\n\n').trim();
        it.status = it.text.length >= 5 ? 'done' : 'fail';
      }catch(e){
        it.status = 'fail';
      }
      renderImgList();
      updateOverallBar();
    }
  }catch(e){
    setOcrBar(true, 0, '✕ ' + (e.message || '识别失败，请重试'));
    imageItems.forEach(it => { if(it.status === 'running' || it.status === 'pending') it.status = 'fail'; });
    renderImgList();
  }finally{
    if(worker){ try{ await worker.terminate(); }catch(e){} }
    ocrRunning = false;
    finishOcr();
    // 队列跑完时若用户中途又加了新图，自动补跑
    if(imageItems.some(it => it.status === 'pending')) runOcrQueue();
  }
}

function finishOcr(){
  const done = imageItems.filter(it => it.status === 'done' && it.text);
  const failed = imageItems.filter(it => it.status === 'fail').length;
  if(!done.length && !failed){ setOcrBar(false); return; }
  const text = done.map(it => it.text).join('\n\n');
  if(text.length >= 20){
    setOcrBar(true, 1, `✓ 共 ${done.length} 张识别完成（${text.length} 字${failed ? '，' + failed + ' 张失败可移除后重试' : ''}），已按顺序合并载入`);
    fillText(text, true);
    setMode('text');
  }else{
    const failNote = failed ? `（${failed} 张识别失败）` : '';
    setOcrBar(true, 1, `识别完成，但可用文字不足${failNote}。建议换更清晰的截图，或直接手动输入。`);
  }
}

/* 选择 / 拖拽 / 粘贴 三种入口（均支持多张） */
$('dropzone').addEventListener('click', () => $('fileInput').click());
$('fileInput').addEventListener('change', e => {
  addImages([...e.target.files]);
  e.target.value = '';
});

$('dropzone').addEventListener('dragover', e => {
  e.preventDefault();
  $('dropzone').classList.add('drag');
});
$('dropzone').addEventListener('dragleave', () => $('dropzone').classList.remove('drag'));
$('dropzone').addEventListener('drop', e => {
  e.preventDefault();
  $('dropzone').classList.remove('drag');
  addImages([...e.dataTransfer.files]);
});

document.addEventListener('paste', e => {
  // 仅在图片模式激活时接管粘贴
  if($('panel-image').style.display === 'none') return;
  const imgs = [...(e.clipboardData?.items || [])]
    .filter(i => i.type.startsWith('image/'))
    .map(i => i.getAsFile())
    .filter(Boolean);
  if(imgs.length) addImages(imgs);
});

/* 移除某张图片 */
$('imgList').addEventListener('click', e => {
  const btn = e.target.closest('.thumb-remove');
  if(!btn) return;
  const i = +btn.dataset.i;
  const it = imageItems[i];
  if(it){
    URL.revokeObjectURL(it.url);
    it.removed = true;
  }
  imageItems = imageItems.filter(x => !x.removed);
  renderImgList();
  if(!imageItems.length) setOcrBar(false);
});

/* 清空时同步清掉图片队列 */
$('btnClear').addEventListener('click', () => {
  imageItems.forEach(it => URL.revokeObjectURL(it.url));
  imageItems = [];
  renderImgList();
  setOcrBar(false);
});

$('annoSwitch').addEventListener('change', e => {
  $('annoPanel').classList.toggle('show', e.target.checked);
});

/* ---------- 复制 ---------- */
document.querySelectorAll('.copy-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    let text = '';
    if(btn.dataset.copy === 'pane1'){
      text = '【这是件什么事】\n' + $('gist').textContent + '\n'
        + [...$('facts').querySelectorAll('.fact')].map(f => f.querySelector('.k').textContent + '：' + f.querySelector('.v').textContent).join('\n');
      const tl = [...$('tlItems').querySelectorAll('.tl-item')].map(t => '· ' + t.textContent.trim());
      if(tl.length) text += '\n\n【时间线】\n' + tl.join('\n');
    } else if(btn.dataset.copy === 'pane2'){
      text = '【你要做什么】\n' + [...$('todos').querySelectorAll('.txt')].map((t,i) => (i+1) + '. ' + t.textContent.trim()).join('\n');
    } else {
      const g = [...$('goodList').querySelectorAll('li')].map(t => '✓ ' + t.textContent);
      const w = [...$('warnList').querySelectorAll('li')].map(t => '! ' + t.textContent);
      const r = [...$('riskList').querySelectorAll('li')].map(t => '✕ ' + t.textContent);
      text = '【好处/注意/风险】\n' + g.join('\n') + '\n' + w.join('\n') + '\n' + r.join('\n');
    }
    navigator.clipboard.writeText(text.trim()).then(() => {
      const old = btn.textContent;
      btn.textContent = '✓ 已复制';
      setTimeout(() => btn.textContent = old, 1500);
    });
  });
});
